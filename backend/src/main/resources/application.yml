server:
  port: 8080

spring:
  application:
    name: marketplace

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  datasource:
    url: jdbc:postgresql://localhost:5432/marketplace
    username: marketplace
    password: marketplace

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    schemas: auth,catalog,chat,transactions,notifications
    default-schema: public
    create-schemas: false
    locations:
      - classpath:db/migration/auth
      - classpath:db/migration/catalog
      - classpath:db/migration/chat
      - classpath:db/migration/transactions
      - classpath:db/migration/notifications

app:
  cors:
    allowed-origin: http://localhost:5173
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-marketplace-huila-32bytes+}
    expiration-minutes: 60
  uploads:
    # Carpeta local donde catalog guarda las fotos de producto; se sirve en /media/**.
    dir: ${UPLOADS_DIR:./uploads}
  # Épica 4 — Transacciones. Los placeholders permiten arrancar/compilar sin cuenta Stripe;
  # las llamadas reales (crear Checkout, verificar webhook) solo ocurren en runtime.
  # Las claves reales NO van acá (git). Se pasan por variable de entorno o por
  # `backend/config/application.yml` (gitignored) — ver docs/claude/estado-actual.md.
  # Para probar: `stripe listen --forward-to localhost:8080/api/transactions/webhook/stripe`
  # (SIN --live) e inyectar STRIPE_SECRET_KEY (sk_test_...) y STRIPE_WEBHOOK_SECRET (whsec_...).
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:sk_test_placeholder}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_placeholder}
  transactions:
    currency: COP
    # Comisión de plataforma. 0 en fase 1 (Decisión 6); subir esta tasa no toca el schema.
    platform-fee-rate: 0.00
    frontend-base-url: ${TRANSACTIONS_FRONTEND_URL:http://localhost:5173}
