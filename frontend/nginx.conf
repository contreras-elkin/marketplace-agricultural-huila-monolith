# Frontend estático + reverse-proxy al backend en el mismo origen: el navegador
# ve una sola dirección, así no hace falta CORS y el WebSocket del chat viaja por
# la misma puerta. `backend` es el nombre del servicio en docker-compose.

upstream backend_upstream {
    server backend:8080;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Subida de fotos de producto: el backend acepta hasta 5 MB; damos margen
    # (nginx corta en 1 MB por defecto y devolvería 413 antes de llegar al backend).
    client_max_body_size 10m;

    # Assets con hash de Vite (immutables): cache larga.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API REST del backend.
    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fotos de producto servidas por el backend (/media/**).
    location /media/ {
        proxy_pass http://backend_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Healthcheck que consume el footer del frontend (BackendStatus).
    location = /health {
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
    }

    # WebSocket del chat: STOMP sobre WebSocket nativo, endpoint /ws. Necesita
    # HTTP/1.1 + cabeceras de upgrade y timeouts largos para sockets ociosos.
    location /ws {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    # SPA: cualquier otra ruta la resuelve el router de React en el cliente.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
